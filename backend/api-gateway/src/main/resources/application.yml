server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: test-service
          uri: lb://test-service
          predicates:
            - Path=/api/test/**

        - id: user-auth-service
          uri: lb://user-auth-service
          predicates:
            - Path=/api/auth/**

        - id: incident-management-service
          uri: lb://incident-management-service
          predicates:
            - Path=/api/incidents/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
